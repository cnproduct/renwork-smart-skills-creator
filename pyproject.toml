[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renwork-smart-skills-creator"
version = "0.1.0"
description = "Local-first, evidence-driven Agent Skill distillation and evolution"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cnproduct"}]
dependencies = []

[project.scripts]
renwork-skills = "renwork_smart_skills.cli:main"

[tool.setuptools]
packages = ["renwork_smart_skills"]
