[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renwork-smart-skills-creator"
version = "0.2.0"
description = "Local-first, evidence-driven Agent Skill distillation, evolution, and commercial protection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cnproduct"}]
dependencies = [
    "cryptography>=41.0.0"
]

[project.scripts]
renwork-skills = "renwork_smart_skills.cli:main"

[tool.setuptools]
packages = ["renwork_smart_skills"]
